name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify CLI entrypoints
        run: |
          howlrelay --help
          howlrelay status --help
          howlrelay handoff --help
          howlrelay brief --help

      - name: Lint with flake8
        run: flake8 src tests

      - name: Run pytest suite
        run: pytest -v

      - name: Dogfood handoff generation on HowlRelay repository
        run: howlrelay handoff --format markdown

      - name: Verify SEO Metadata & Artifacts
        run: python3 scripts/test_seo.py
